<!doctype html>
<html><head><meta charset="utf-8"><title>splash harness</title>
<style>
  body{margin:0; background:#222; font-family:monospace; color:#eee}
  .row{display:flex; gap:8px; padding:8px; flex-wrap:wrap}
  iframe{border:2px solid #555; display:block}
  pre{white-space:pre-wrap; padding:8px; background:#111; margin:0}
</style>
</head>
<body>
  <div class="row">
    <div>
      <div>1440px</div>
      <iframe id="f1440" src="http://localhost:8934/index.html" style="width:1440px; height:900px;"></iframe>
    </div>
    <div>
      <div>390px</div>
      <iframe id="f390" src="http://localhost:8934/index.html" style="width:390px; height:844px;"></iframe>
    </div>
  </div>
  <pre id="out">running...</pre>
<script>
function measure(win, doc, label){
  // freeze animations at a settled post-inflate state and force .go
  const splash = doc.getElementById('screen-splash');
  splash.classList.remove('off');
  splash.classList.add('go');
  // force layout, then pause all animations so state is stable to read
  doc.querySelectorAll('*').forEach(el=>{
    try{
      const anims = el.getAnimations ? el.getAnimations() : [];
      anims.forEach(a=>{ try{ a.pause(); a.currentTime = a.effect.getTiming().duration===Infinity?0:a.effect.getTiming().duration; }catch(e){} });
    }catch(e){}
  });
  return new Promise(resolve=>{
    setTimeout(()=>{
      const letters = [...doc.querySelectorAll('#screen-splash .balloon')].map(b=>b.getBoundingClientRect());
      const balloons = [...doc.querySelectorAll('#screen-splash .kq-splashdrift')].map(b=>b.getBoundingClientRect());
      const lanterns = doc.querySelectorAll('.kq-lantern').length;
      const skyClass = doc.querySelector('#screen-splash .kq-sky').className;
      function overlap(a,b){
        return !(a.right<=b.left || a.left>=b.right || a.bottom<=b.top || a.top>=b.bottom);
      }
      let overlaps = [];
      letters.forEach((l,li)=>balloons.forEach((bb,bi)=>{
        if(overlap(l,bb)) overlaps.push('letter'+li+' x balloon'+bi);
      }));
      resolve({
        label,
        skyClass,
        lanternCount: lanterns,
        letterCount: letters.length,
        letterRects: letters.map(r=>({x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)})),
        balloonCount: balloons.length,
        overlaps
      });
    }, 300);
  });
}
async function run(){
  const f1440 = document.getElementById('f1440');
  const f390 = document.getElementById('f390');
  await new Promise(r=>{ if(f1440.contentDocument.readyState==='complete') r(); else f1440.onload=r; });
  await new Promise(r=>{ if(f390.contentDocument.readyState==='complete') r(); else f390.onload=r; });
  await new Promise(r=>setTimeout(r,300));
  const r1 = await measure(f1440.contentWindow, f1440.contentDocument, '1440px');
  const r2 = await measure(f390.contentWindow, f390.contentDocument, '390px');
  document.getElementById('out').textContent = JSON.stringify([r1,r2], null, 2);
  window.__harnessResult = [r1,r2];
}
run();
</script>
</body></html>
